[target.xtensa-esp32s3-none-elf]
# Original
# runner = "probe-rs run --chip=esp32s3 --preverify --always-print-stacktrace --no-location"
runner = "probe-rs run --chip=esp32s3"

[env]
DEFMT_LOG = "info"

[build]
# Original from setup script
# rustflags = [
#   "-C", "link-arg=-nostartfiles",
#   "-Z", "stack-protector=all",
# ]
rustflags = [
  # Required linker arguments for the ESP32-S3 memory and boot ROM mapping
  "-C",
  "link-arg=-Tlinkall.x",
  "-C",
  "link-arg=-Trom_functions.x",
  "-C",
  "link-arg=-nostartfiles",

  # Stack-Smashing Protection Canary
  "-Z",
  "stack-protector=all",
]

target = "xtensa-esp32s3-none-elf"

[unstable]
# Allows the compiler to rebuild core and alloc libraries with the stack protector flags
build-std = ["alloc", "core"]
