[target.xtensa-esp32s3-none-elf]
# Original
# runner = "probe-rs run --chip=esp32s3 --preverify --always-print-stacktrace --no-location"
runner = "probe-rs run --chip=esp32s3"
linker = "xtensa-esp32s3-elf-gcc"
rustflags = [
  "-C",
  "link-arg=-nostartfiles",

  # Stack-Smashing Protection Canary
  "-Z",
  "stack-protector=all",
]

[env]
DEFMT_LOG = "info"

[build]
target = "xtensa-esp32s3-none-elf"

[unstable]
# Allows the compiler to rebuild core and alloc libraries with the stack protector flags
build-std = ["alloc", "core"]

[alias]
test-host = "test --target x86_64-unknown-linux-gnu --lib"
